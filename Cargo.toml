[package]
name = "rustyfem"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RustyFEM – FEM solver in Rust"

[features]
# `cli`: the command-line program `rustyfem` (run, check, baseline, list).
# `dynlib`: UMAT/UEL from shared libraries. Both are off in the app (iOS does not allow
# code loaded from outside the app).
default = ["cli", "dynlib"]
cli = []
dynlib = []

[[bin]]
name = "rustyfem"
path = "src/main.rs"
required-features = ["cli"]

[workspace]
members = ["ffi", "app/session", "app/src-tauri"]

[profile.release]
opt-level = 3

# The app in debug mode (`tauri dev`): the engine is optimized anyway, otherwise solving is slow.
[profile.dev.package.rustyfem]
opt-level = 3

[profile.dev.package.rustyfem-session]
opt-level = 3
