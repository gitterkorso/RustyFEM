name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Tests (app API)
        run: cargo test --release -p rustyfem-session
      - name: Engine without cli/dynlib
        run: cargo build --release -p rustyfem --lib --no-default-features
      - name: User interface
        working-directory: web
        run: |
          npm ci
          npx tsc
      - name: Build the app
        working-directory: web
        run: npm run tauri build -- --no-bundle

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - name: Engine and app API for iOS
        run: |
          cargo build --release -p rustyfem-session --target aarch64-apple-ios
          cargo build --release -p rustyfem-session --target aarch64-apple-ios-sim
