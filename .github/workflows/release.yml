name: release

# Builds installers for Windows and Linux and publishes them as a release
# when a tag vX.Y.Z is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
      platforms:
        description: "Which installers to build"
        type: choice
        options: [all, windows, windows32, linux]
        default: all

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  NOTES: |
    RustyFEM for Windows, macOS and Linux. Pick the file for your computer:

    | Your computer | Download | Notes |
    | --- | --- | --- |
    | **Windows, 64-bit** (almost all PCs) | `RustyFEM_*_x64-setup.exe` | Installer – start here if unsure. |
    | Windows, 64-bit, managed by IT | `RustyFEM_*_x64_en-US.msi` | MSI package for company deployment tools. |
    | **Windows, 32-bit** (older PCs) | `RustyFEM_*_x86-setup.exe` | Installer. |
    | Windows, 32-bit, managed by IT | `RustyFEM_*_x86_en-US.msi` | MSI package. |
    | **macOS** (Apple silicon and Intel) | `RustyFEM_*_universal.dmg` | Open it and drag RustyFEM to Applications. |
    | **Linux**, any distribution | `RustyFEM_*_amd64.AppImage` | `chmod +x` the file, then run it. |
    | Linux, Debian / Ubuntu | `RustyFEM_*_amd64.deb` | `sudo apt install ./RustyFEM_*_amd64.deb` |

    **Not sure whether your Windows is 64- or 32-bit?** Open *Settings → System → About* and look at *System type*.

    The Windows installers are not code-signed yet, so SmartScreen may warn the first time: choose *More info → Run anyway*.

jobs:
  windows:
    if: contains(fromJSON('["", "all", "windows"]'), github.event.inputs.platforms || '')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build installers (MSI and setup.exe)
        working-directory: web
        run: |
          npm ci
          npm run tauri build -- --bundles msi,nsis
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe)
          gh release create "$TAG" $files --title "RustyFEM ${TAG}" --notes "$NOTES" \
            || gh release upload "$TAG" $files --clobber

  windows32:
    if: contains(fromJSON('["", "all", "windows32"]'), github.event.inputs.platforms || '')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build 32-bit installers (MSI and setup.exe)
        working-directory: web
        run: |
          npm ci
          npm run tauri build -- --target i686-pc-windows-msvc --bundles msi,nsis
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=target/i686-pc-windows-msvc/release/bundle
          files=$(ls $dir/msi/*.msi $dir/nsis/*-setup.exe)
          gh release create "$TAG" $files --title "RustyFEM ${TAG}" --notes "$NOTES" \
            || gh release upload "$TAG" $files --clobber

  linux:
    if: contains(fromJSON('["", "all", "linux"]'), github.event.inputs.platforms || '')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build installers (AppImage and deb)
        working-directory: web
        run: |
          npm ci
          npm run tauri build -- --bundles appimage,deb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb)
          gh release create "$TAG" $files --title "RustyFEM ${TAG}" --notes "$NOTES" \
            || gh release upload "$TAG" $files --clobber
