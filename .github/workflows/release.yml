name: release

# Bygger installationspaket för Windows och publicerar dem som en release
# när en tagg vX.Y.Z pushas.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tagg att släppa (t.ex. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bygg installationspaket (MSI och setup.exe)
        working-directory: web
        run: |
          npm ci
          npm run tauri build -- --bundles msi,nsis
      - name: Publicera release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe)
          notes="RustyFEM ${TAG} för Windows (64-bitars).

          - **RustyFEM_*_x64-setup.exe** – installationsprogram (rekommenderas).
          - **RustyFEM_*_x64_*.msi** – MSI-paket för installation via företagets verktyg.

          Installationsfilerna är inte kodsignerade ännu, så Windows SmartScreen kan
          varna första gången: välj *Mer information → Kör ändå*."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "RustyFEM ${TAG}" --notes "$notes"
          fi
