name: release

# Builds installers for Windows and publishes them as a release
# when a tag vX.Y.Z is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build installers (MSI and setup.exe)
        working-directory: web
        run: |
          npm ci
          npm run tauri build -- --bundles msi,nsis
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe)
          notes="RustyFEM ${TAG} for Windows (64-bit).

          - **RustyFEM_*_x64-setup.exe** – installer (recommended).
          - **RustyFEM_*_x64_*.msi** – MSI package for installation with company deployment tools.

          The installers are not code-signed yet, so Windows SmartScreen may
          warn the first time: choose *More info → Run anyway*."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "RustyFEM ${TAG}" --notes "$notes"
          fi
