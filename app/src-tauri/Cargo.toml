[package]
name = "rustyfem-app"
version = "0.1.0"
edition = "2021"
description = "RustyFEM – app med grafiskt gränssnitt (Tauri)"

[lib]
name = "rustyfem_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustyfem = { path = "../..", default-features = false }
rustyfem-session = { path = "../session" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
