[package]
name = "rustyfem-session"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "App API for RustyFEM: session, undo/redo, runs with progress, display data and project file"

[dependencies]
rustyfem = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
